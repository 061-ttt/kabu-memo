<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4ECDA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="相場帖">
<title>相場帖</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="top">
  <div class="bar1">
    <div class="brand"><span class="seal" aria-hidden="true">帖</span><b>相場帖</b><small>備忘録</small></div>
    <nav class="datenav" aria-label="日付">
      <button id="prevDay" aria-label="前の営業日">‹</button>
      <span class="dl" id="dateLabel"></span>
      <button class="today" id="todayBtn" hidden>今日</button>
      <button id="nextDay" aria-label="次の営業日">›</button>
    </nav>
    <div class="tools">
      <div class="fontctl" aria-label="文字サイズ"><button id="fontDn" aria-label="文字を小さく">A−</button><span id="fontPct">100%</span><button id="fontUp" aria-label="文字を大きく">A+</button></div>
      <button class="tbtn" id="soundBtn" aria-label="効果音" aria-pressed="false"></button>
      <button class="tbtn" id="modeBtn" aria-label="ダークモード切り替え"></button>
      <span id="acctSlot"></span>
      <button class="tbtn" id="moreBtn" aria-label="メニュー"></button>
      <span class="clock" id="clock" aria-label="現在時刻"></span><span class="sync off" id="syncDot" title="この端末に保存"></span>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<main id="main"></main>
<footer class="disc" id="disc">投資助言ではありません。株価・指標は J-Quants（JPX総研）などから取得したもので、売買の前に元の情報源で確かめてください。</footer>
<div id="dockHost"></div>
<button class="cat walk" id="cat" aria-label="こばんに話しかける"></button>
<div class="bubble" id="bubble" role="status" hidden></div>
<div class="toast" id="toast" role="status" data-testid="toast"></div>
<datalist id="themes"></datalist>
<script type="module" src="./app.js"></script>
</body>
</html>
